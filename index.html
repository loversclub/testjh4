.call .cn{margin-top:104px;font-size:34px;font-weight:500;letter-spacing:-.5px;padding:0 30px}
.call .cst{font-size:19px;opacity:.7;margin-top:4px}
.cscr{margin-top:52px;width:100%;padding:0 30px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.csp{font-size:14px;font-weight:600;color:#a9bbd6;letter-spacing:.5px;animation:csf .4s}
.ctx{font-size:23px;font-weight:600;line-height:1.4;word-break:keep-all;animation:csf .4s}
@keyframes csf{from{opacity:0;transform:translateY(6px)}}
.cgrid{position:absolute;left:0;right:0;top:428px;display:grid;grid-template-columns:repeat(3,80px);justify-content:center;gap:18px 34px}
.cb2{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:#fff}
.cc{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff}.cc.on{background:#fff;color:#000}
.call .ep{bottom:86px}

/* ===== 인스타 추가 ===== */
.igu{font:inherit;font-weight:inherit;color:inherit;padding:0}
.igdot{flex:none;width:9px;height:9px;border-radius:50%;background:#0095f6}
.igb{white-space:pre-wrap}
.igcta{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#efefef;font-size:14px;font-weight:600;color:#0a58ff}

/* ===== 알림 배너 ===== */
#noti{position:absolute;z-index:150;top:54px;left:10px;right:10px;border-radius:26px;background:rgba(236,236,240,.88);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 8px 30px #0005;padding:12px 14px;display:flex;gap:11px;align-items:center;color:#000;cursor:pointer;animation:nin .45s cubic-bezier(.2,.9,.3,1)}
#noti.out{animation:nout .4s ease-in forwards}
@keyframes nin{from{transform:translateY(-120px);opacity:0}}

/* ===== v3 추가 CSS ===== */
.cend{position:absolute!important;inset:0;z-index:30;pointer-events:none;animation:cfade .42s ease-out forwards!important}
@keyframes cfade{to{opacity:0}}
.call.cin{animation:callin .45s cubic-bezier(.2,.75,.25,1)}
@keyframes callin{from{opacity:0;transform:scale(1.07);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.call.cin .cn,.call.cin .cst{animation:csf .55s .05s both}
.call.cin .cgrid{animation:cbtn .5s .14s both cubic-bezier(.2,.8,.2,1)}
.call.cin .ep{animation:cbtn .5s .2s both cubic-bezier(.2,.8,.2,1)}
@keyframes cbtn{from{opacity:0;transform:translateY(16px) scale(.94)}}
.call.ending .cgrid,.call.ending .cscr{opacity:.35;transition:opacity .25s;pointer-events:none}
.call.ending .ep{opacity:.45;background:#8e8e93;transition:opacity .25s,background .25s;pointer-events:none}
@keyframes cup{0%{transform:translateY(0);opacity:1}70%{opacity:1}100%{transform:translateY(-102%);opacity:.2}}
.cgrid{top:420px!important;grid-template-columns:repeat(3,76px)!important;gap:26px 38px!important}
.cb2{font-size:12.5px;white-space:nowrap}
.dmr{display:flex;align-items:flex-end;gap:8px;margin:1.5px 0;width:100%}.dmr.ge{margin-bottom:8px}.dmr.me{justify-content:flex-end}
.dmav{width:28px;height:28px;flex:none}
.dmb{max-width:72%;padding:10px 14px;border-radius:22px;font-size:15px;line-height:1.38;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;text-align:left}
.dmb.th{background:#efefef;color:#000}.dmb.me{background:linear-gradient(#8a5cff,#5b6cff);color:#fff}
.dmb.th.p{border-top-left-radius:6px}.dmb.th.n{border-bottom-left-radius:6px}.dmb.me.p{border-top-right-radius:6px}.dmb.me.n{border-bottom-right-radius:6px}
.dmr .igsh{border-radius:22px}
.dmin{flex:none;margin:6px 12px 34px;background:#efefef;border-radius:24px;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px 0 6px;color:#737373;font-size:15px}
.dmin .cam{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7a4dff,#4f7bff);display:flex;align-items:center;justify-content:center;flex:none}
.dmin svg{display:block;width:24px;height:24px}.dmin .cam svg{width:19px;height:19px}
.nvrx{margin:22px 0 4px;padding:18px 0 6px;border-top:1px solid #eee;text-align:center}
.nvrx p{margin:0 0 12px!important;font-size:13.5px!important;color:#555}
.nvrx div{display:flex;gap:10px;justify-content:center}
.nvrx span{flex:1;max-width:160px;height:46px;border-radius:23px;border:1px solid #d9dce1;background:#fff;font-size:14.5px;color:#333;display:flex;align-items:center;justify-content:center;gap:5px}
.nvrx span.on{border-color:#03c75a;color:#03c75a;background:#eefbf3;font-weight:700}

/* ===== 맥도날드 ===== */
.page.mcp::before{background:#db0007}
.mcp .mh{background:#db0007;color:#fff;padding:6px 16px 58px;display:flex;align-items:center;gap:12px;flex:none}
.mcp .mh .lg{display:flex;align-items:center;gap:8px;flex:1;font-size:21px;font-weight:800;letter-spacing:-.5px}
.mcp .mh svg{display:block}
.mcvip{margin:-44px 14px 0;border-radius:20px;padding:16px 16px 14px;color:#fff;background:linear-gradient(135deg,#1d1d1f 0%,#3a2a1a 55%,#6b4a10 100%);position:relative;overflow:hidden;box-shadow:0 8px 20px #0003}
.mcvip::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#ffc72c66,transparent 70%)}
.mcvip .bd{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#ffd95a,#ffb300);color:#4a3000;font-weight:900;font-size:12.5px;letter-spacing:.6px;padding:4px 10px 4px 8px;border-radius:12px}
.mcvip .pg{height:7px;border-radius:4px;background:#ffffff30;margin:10px 0 6px;overflow:hidden}.mcvip .pg i{display:block;height:100%;width:72%;background:linear-gradient(90deg,#ffd95a,#ffb300);border-radius:4px}
.mcq{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 14px 6px}
.mcq div{background:#fff;border-radius:16px;box-shadow:0 2px 10px #0001;padding:12px 4px 10px;text-align:center;font-size:13px;font-weight:700;color:#222}.mcq span{display:block;font-size:28px;margin-bottom:4px}
.mcb{margin:12px 14px 0;border-radius:18px;padding:18px;display:flex;align-items:center;gap:10px;overflow:hidden}
.mch{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px}
.mch div{flex:none;width:132px;background:#fff;border-radius:16px;box-shadow:0 2px 10px #0001;overflow:hidden;font-size:13.5px;font-weight:700;color:#222}
.mch div i{display:flex;align-items:center;justify-content:center;height:96px;font-size:48px;font-style:normal;background:#fff4d6}.mch div p{margin:0;padding:8px 10px 10px}.mch small{display:block;font-weight:500;color:#777;font-size:12px;margin-top:2px}
.mct{padding:20px 16px 10px;font-size:19px;font-weight:800;color:#222}

/* ===== 인스타 게시물 여러 장 슬라이드 ===== */
.igcw{position:relative}
.igtr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;cursor:grab}.igtr::-webkit-scrollbar{display:none}
.igsl{flex:none;width:100%;scroll-snap-align:center;scroll-snap-stop:always}
.igcn{position:absolute;top:12px;right:12px;background:rgba(26,26,26,.7);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;pointer-events:none}
.iga{position:relative}.igdots{position:absolute;left:50%;top:50%;transform:translate(-50%,-38%);display:flex;gap:4px;pointer-events:none}
.igdots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7;transition:background .15s}.igdots i.on{background:#0095f6}
/* ===== 설정 앱 (iOS 스타일) ===== */
.sgrp{margin:0 16px 20px;background:#fff;border-radius:12px;overflow:hidden}
.srow{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px 0 16px;font-size:17px;text-align:left;color:#000}
.srow.ic{padding-left:12px}
.srow .si{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.srow .si svg{width:19px;height:19px;display:block}
.srow .sl{flex:1;padding:11px 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sv{color:#8e8e93;font-size:17px}
.srow .sc{color:#c4c4c7;font-size:23px;line-height:1;margin-left:2px}
.srow::after{content:"";position:absolute;left:16px;right:0;bottom:0;border-bottom:.5px solid #c6c6c8}.srow.ic::after{left:53px}.srow:last-child::after{display:none}
.sprof{display:flex;gap:14px;align-items:center;padding:12px 16px;width:100%}
.spav{width:60px;height:60px;border-radius:50%;background:linear-gradient(#b8bcc6,#7d828d);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
/* ===== 전원 종료/재시작 ===== */
#off{position:absolute;inset:0;z-index:300;background:#000;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease}
#off.on{opacity:1;pointer-events:auto}
#off svg{width:74px;height:auto;fill:#fff;opacity:0;transition:opacity .9s ease}
#off.logo svg{opacity:1}
/* ===== 수신 전화 배너 ===== */
#icall{position:absolute;z-index:160;top:54px;left:10px;right:10px;border-radius:30px;background:rgba(48,48,52,.94);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 8px 30px #0006;padding:14px 16px;display:flex;gap:12px;align-items:center;color:#fff;animation:nin .45s cubic-bezier(.2,.9,.3,1)}
#icall.out{animation:nout .4s ease-in forwards}
.icb{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.icb.r{background:#ff3b30}.icb.g{background:#34c759}
/* ===== 통화 화면 버튼 줄 ===== */
.cbar{position:absolute;left:0;right:0;bottom:196px;display:flex;justify-content:space-between;padding:0 18px}
.cbar .cb2{width:62px;font-size:11.5px;white-space:nowrap;gap:8px}
.cbar .cc{width:62px;height:62px}
/* ===== 인스타 팔로잉 시트 ===== */
.igsx{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}

@keyframes nout{to{transform:translateY(-120px);opacity:0}}

function gqBody(){const im=(n,c)=>`<div class="gimg ${c||''}"><span>IMAGE ${n+1}</span><img src="${GQI[n]}" alt="" onerror="this.remove()"></div>`;
 let o=`<div class="nav"><span>MENU</span><span class="logo"><b>GQ</b><small>KOREA</small></span><span>SEARCH</span></div>`+im(0)+'<div class="gw">';
 GQ.forEach(r=>{const i=r.indexOf('|'),k=r.slice(0,i),t=r.slice(i+1);
  if(k==='T'){const[a,b,c]=t.split('|');o+=`<div class="gk">${a}</div><h2 class="gt">${b.split('/').map(E).join('<br>')}</h2><div class="gm">${c}</div>`}
  else if(k==='L')o+=`<p class="gl">${E(t)}</p>`;
  else if(k==='P')o+=`<p class="gp">${E(t)}</p>`;
  else if(k==='H')o+=`<div class="gh">${E(t)}</div>`;
  else if(k==='Q')o+=`<p class="gqq">Q. ${E(t)}</p>`;
  else if(k==='A')o+=`<p class="gqa"><b>김영훈</b>${E(t)}</p>`;
  else if(k==='B')o+=`<p class="gqa">${E(t)}</p>`;
  else if(k==='W')o+=`<p class="gend">“${E(t)}”</p>`;
  else if(k==='I')o+=`</div>${im(+t)}<div class="gw">`;
  else if(k==='X'){const[a,b]=t.split(',');o+=`</div><div class="gx">${im(+a,'g1')}${im(+b,'g2')}</div><div class="gw">`}});
 return o+`<div class="gfoot">GQ KOREA · AUGUST 2026</div></div>`}
